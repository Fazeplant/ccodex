name: Release

# This fork publishes GitHub Releases carrying the npm-packed main and relay
# tarballs; scripts/install.sh and `ccodex update` install from those assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing v* tag to (re)build and release
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: v* tag to build and release
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate tag and package version
        env:
          TAG: ${{ inputs.ref || github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "${TAG#refs/tags/}"

  relay:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin, package: relay-darwin-arm64 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, package: relay-linux-arm64-gnu }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, package: relay-linux-x64-gnu }
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: docker/setup-buildx-action@v3
        if: runner.os == 'Linux'
      - uses: actions/cache@v4
        if: runner.os == 'macOS'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relay/target/release
            relay/target/${{ matrix.target }}/release
          key: relay-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('relay/Cargo.lock') }}
      - if: runner.os == 'macOS'
        run: rustup target add "${{ matrix.target }}"
      - if: runner.os == 'macOS'
        env:
          CCODEX_RELAY_TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: ./scripts/build-relay.sh
      - if: runner.os == 'Linux'
        run: ./scripts/build-linux-relay.sh "${{ matrix.target }}" "${{ matrix.package }}"
      - run: node release/verify-packages.mjs --target "${{ matrix.package }}"
      - run: packages/${{ matrix.package }}/bin/ccodex-relay --help
      - run: mkdir -p artifacts && npm pack ./packages/${{ matrix.package }} --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/*.tgz
          if-no-files-found: error

  main:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:codex-assets
      - run: npm run check:protocol-generated
      - run: npx vitest run --config config/vitest.config.ts
      - run: npm run test:contracts
      - run: node release/verify-packages.mjs
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: ccodex-main
          path: artifacts/*.tgz
          if-no-files-found: error

  metadata:
    needs: [relay, main]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - run: node release/generate-manifest.mjs release-artifacts
      - run: npm sbom --omit=dev --sbom-format cyclonedx > release-artifacts/npm-sbom.cdx.json
      - run: node release/generate-cargo-sbom.mjs release-artifacts/cargo-sbom.cdx.json
      - run: node release/generate-notices.mjs && cp legal/THIRD_PARTY_NOTICES.md release-artifacts/
      - run: cp scripts/install.sh scripts/uninstall.sh release-artifacts/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            release-artifacts/release-manifest.json
            release-artifacts/SHA256SUMS
            release-artifacts/npm-sbom.cdx.json
            release-artifacts/cargo-sbom.cdx.json
            release-artifacts/THIRD_PARTY_NOTICES.md
            release-artifacts/install.sh
            release-artifacts/uninstall.sh
          if-no-files-found: error

  github-release:
    needs: [relay, main, metadata]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: node release/legal-gate.mjs
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          tag=${TAG#refs/tags/}
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-artifacts/* --clobber
          else
            gh release create "$tag" release-artifacts/* --verify-tag --latest --title "$tag" \
              --notes "$(git log -1 --format=%B)"
          fi
